<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>Orbit early workspace</title><desc>Original interface for a fictional AI product, created for the DemoPop launch demonstration.</desc><defs></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#e6e7eb" stroke="none"/>
